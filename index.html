<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#25346f">
  <meta name="application-name" content="Infoscreen Steuerung">
  <meta name="apple-mobile-web-app-title" content="Infoscreen Steuerung">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Infoscreen Steuerung</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- ICONS -->
  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./app-icon.png?v=20260924"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="./app-icon.png?v=20260924"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./app-icon.png?v=20260924"
  >

  <style>
    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      width:100%;
      max-width:100%;
      height:100%;
      overflow:hidden;
      overflow-x:hidden;
      overscroll-behavior:none;
      touch-action:pan-y;
      background:#f4f6fa;
      font-family:Arial, Helvetica, sans-serif;
    }

    #app {
      position:fixed;
      inset:0;
      width:100vw;
      max-width:100vw;
      height:100%;
      border:0;
      overflow:hidden;
      overscroll-behavior:none;
      background:#f4f6fa;
    }

    /* =====================================================
       LOADING
       ===================================================== */

    #loading {
      position:fixed;
      inset:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(
        135deg,
        #f4f6fa,
        #eef1fb
      );
    }

    .logo-badge {
      width:72px;
      height:72px;
      object-fit:contain;
      display:block;
      margin:0 auto 12px;
      padding:5px;
      border-radius:18px;
      background:#fff;
      border:1px solid #e4e8f0;
      box-shadow:0 8px 20px rgba(38,54,111,.08);
    }

    .card {
      width:min(420px,calc(100% - 32px));
      padding:26px 22px;
      background:#fff;
      border:1px solid #e4e8f0;
      border-radius:20px;
      box-shadow:0 10px 35px rgba(38,54,111,.08);
      text-align:center;
    }

    .brand {
      font-size:10px;
      font-weight:900;
      letter-spacing:.08em;
      color:#34499a;
      margin-bottom:7px;
    }

    h1 {
      margin:0;
      font-size:23px;
      color:#25346f;
    }

    p {
      margin:8px 0 0;
      color:#718096;
      font-size:12px;
      line-height:1.5;
    }

    .spinner {
      width:38px;
      height:38px;
      margin:20px auto 0;
      border-radius:50%;
      border:4px solid #e4e8f0;
      border-top-color:#34499a;
      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    /* =====================================================
       INSTALLATION
       ===================================================== */

    #installOverlay {
      position:fixed;
      inset:0;
      z-index:99999;

      display:none;
      align-items:flex-end;
      justify-content:center;

      padding:16px;

      background:rgba(15,22,42,.72);

      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
    }

    #installOverlay.show {
      display:flex;
    }

    .install-card {
      width:min(450px,100%);
      padding:26px 21px;

      margin-bottom:
        env(safe-area-inset-bottom);

      border-radius:25px;
      background:#fff;

      text-align:center;

      box-shadow:
        0 25px 80px rgba(0,0,0,.32);
    }

    .install-icon {
      width:82px;
      height:82px;

      margin:0 auto 14px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:22px;

      background:#fff;

      border:1px solid #e4e8f0;

      box-shadow:
        0 8px 22px rgba(38,54,111,.10);
    }

    .install-icon img {
      width:72px;
      height:72px;
      object-fit:contain;
      border-radius:18px;
    }

    .install-brand {
      color:#34499a;
      font-size:9px;
      font-weight:900;
      letter-spacing:.08em;
    }

    .install-card h2 {
      margin:7px 0 8px;
      color:#25346f;
      font-size:23px;
      font-weight:900;
    }

    .install-card p {
      color:#718096;
      font-size:13px;
      line-height:1.5;
    }

    .install-button {
      width:100%;
      min-height:54px;
      margin-top:20px;

      border:0;
      border-radius:14px;

      background:
        linear-gradient(
          135deg,
          #25346f,
          #34499a
        );

      color:#fff;

      font-size:14px;
      font-weight:900;

      cursor:pointer;
    }

    .install-later {
      width:100%;
      min-height:48px;

      margin-top:9px;

      border:0;
      border-radius:14px;

      background:#edf0f5;
      color:#354052;

      font-size:12px;
      font-weight:900;

      cursor:pointer;
    }

    #iosHelp {
      display:none;

      margin-top:16px;
      padding:17px;

      border-radius:15px;

      background:#eef1fb;
      color:#25346f;

      font-size:13px;
      line-height:1.5;
    }

    .browser-help {
      margin-top:15px;
      padding:15px;

      border-radius:15px;

      background:#eef1fb;
      color:#25346f;

      font-size:12px;
      line-height:1.6;
    }
  </style>
</head>

<body>

  <!-- =====================================================
       INFOSCREEN STEUERUNG
       ===================================================== -->

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbw3G2Nb5Wn5vnz0qM7O8BKhbKeFaGF0yuf_-iZCgjl4D8ai9cUw6DVdeWmBlylYWgVn/exec?page=steuerung"
    allow="
      camera;
      microphone;
      clipboard-read;
      clipboard-write
    ">
  </iframe>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div id="loading">

    <div class="card">

      <img
        class="logo-badge"
        src="./app-icon.png?v=20260924"
        alt="Feuerwehr St. Pölten Stadt"
      >

      <div class="brand">
        FEUERWEHR ST. PÖLTEN-STADT
      </div>

      <h1>
        Infoscreen Steuerung
      </h1>

      <p>
        Web-App wird geladen …
      </p>

      <div class="spinner"></div>

    </div>

  </div>


  <!-- =====================================================
       INSTALLATION
       ===================================================== -->

  <div id="installOverlay">

    <div class="install-card">

      <div class="install-icon">

        <img
          src="./app-icon.png?v=20260924"
          alt="Infoscreen Steuerung"
        >

      </div>

      <div class="install-brand">
        FEUERWEHR ST. PÖLTEN-STADT
      </div>

      <h2>
        Infoscreen Steuerung installieren
      </h2>

      <p id="installText">
        Infoscreen Steuerung kann als App
        auf diesem Gerät installiert werden.
      </p>


      <div id="iosHelp">

        <strong>
          iPhone / iPad
        </strong>

        <br><br>

        Tippe in Safari auf

        <br><br>

        <strong>
          Teilen ⬆️
        </strong>

        <br><br>

        und anschließend auf

        <br>

        <strong>
          „Zum Home-Bildschirm“
        </strong>

      </div>


      <button
        id="installButton"
        class="install-button"
        style="display:none;"
      >
        📲 App installieren
      </button>


      <button
        id="installLater"
        class="install-later"
      >
        Jetzt nicht
      </button>

    </div>

  </div>


  <script>

    /* =====================================================
       ELEMENTE
       ===================================================== */

    const frame =
      document.getElementById('app');

    const loading =
      document.getElementById('loading');

    const installOverlay =
      document.getElementById(
        'installOverlay'
      );

    const installButton =
      document.getElementById(
        'installButton'
      );

    const installLater =
      document.getElementById(
        'installLater'
      );

    const installText =
      document.getElementById(
        'installText'
      );

    const iosHelp =
      document.getElementById(
        'iosHelp'
      );


    /* =====================================================
       LOADING
       ===================================================== */

    frame.addEventListener(
      'load',
      function() {

        loading.style.display =
          'none';

      }
    );


    setTimeout(
      function() {

        loading.style.display =
          'none';

      },
      10000
    );


    /* =====================================================
       INSTALL PARAMETER
       ===================================================== */

    const params =
      new URLSearchParams(
        location.search
      );

    const installRequested =
      params.get('install') === '1';


    /* =====================================================
       BEREITS INSTALLIERT?
       ===================================================== */

    function isInstalled() {

      return (

        window.matchMedia(
          '(display-mode: standalone)'
        ).matches

        ||

        window.navigator.standalone === true

      );

    }


    /* =====================================================
       INSTALL EVENT
       ===================================================== */

    let deferredPrompt =
      null;


    window.addEventListener(
      'beforeinstallprompt',
      function(event) {

        console.log(
          'Infoscreen: Installation verfügbar'
        );


        event.preventDefault();


        deferredPrompt =
          event;


        if (
          installRequested &&
          !isInstalled()
        ) {

          showInstall();

        }

      }
    );


    /* =====================================================
       INSTALLATION ANZEIGEN
       ===================================================== */

    function showInstall() {

      if (isInstalled()) {

        cleanUrl();

        return;

      }


      iosHelp.style.display =
        'none';


      installButton.style.display =
        'block';


      installText.innerHTML =
        `
          Infoscreen Steuerung kann
          als App auf diesem Gerät
          installiert werden.
        `;


      installOverlay.classList.add(
        'show'
      );

    }


    /* =====================================================
       IPHONE
       ===================================================== */

    function showIosInstall() {

      installButton.style.display =
        'none';


      iosHelp.style.display =
        'block';


      installText.innerHTML =
        `
          Installiere die Infoscreen
          Steuerung auf deinem
          Home-Bildschirm.
        `;


      installOverlay.classList.add(
        'show'
      );

    }


    /* =====================================================
       SAMSUNG FALLBACK
       ===================================================== */

    function showSamsungHelp() {

      installButton.style.display =
        'none';


      iosHelp.style.display =
        'none';


      installText.innerHTML =
        `
          <b>
            Infoscreen Steuerung wurde geöffnet.
          </b>

          <div class="browser-help">

            Falls dein Browser keinen
            Installationsdialog anzeigt:

            <br><br>

            <b>
              ☰ Browser-Menü
            </b>

            <br>

            → <b>Seite hinzufügen zu</b>

            <br>

            → <b>Startbildschirm</b>

          </div>
        `;


      installOverlay.classList.add(
        'show'
      );

    }


    /* =====================================================
       INSTALL BUTTON
       ===================================================== */

    installButton.addEventListener(
      'click',
      async function() {

        if (!deferredPrompt) {

          showSamsungHelp();

          return;

        }


        deferredPrompt.prompt();


        const result =
          await deferredPrompt.userChoice;


        console.log(
          'Installation:',
          result.outcome
        );


        deferredPrompt =
          null;


        installOverlay.classList.remove(
          'show'
        );


        cleanUrl();

      }
    );


    /* =====================================================
       JETZT NICHT
       ===================================================== */

    installLater.addEventListener(
      'click',
      function() {

        installOverlay.classList.remove(
          'show'
        );


        cleanUrl();

      }
    );


    /* =====================================================
       URL AUFRÄUMEN
       ===================================================== */

    function cleanUrl() {

      const url =
        new URL(location.href);


      url.searchParams.delete(
        'install'
      );


      url.searchParams.delete(
        'source'
      );


      history.replaceState(
        {},
        '',
        url.pathname +
        url.search +
        url.hash
      );

    }


    /* =====================================================
       INSTALLATION ERFOLGREICH
       ===================================================== */

    window.addEventListener(
      'appinstalled',
      function() {

        console.log(
          'Infoscreen Steuerung installiert'
        );


        deferredPrompt =
          null;


        installOverlay.classList.remove(
          'show'
        );


        cleanUrl();

      }
    );


    /* =====================================================
       START
       ===================================================== */

    window.addEventListener(
      'load',
      function() {

        if (!installRequested) {

          return;

        }


        if (isInstalled()) {

          cleanUrl();

          return;

        }


        const ua =
          navigator.userAgent;


        const ios =

          /iPhone|iPad|iPod/i.test(ua)

          ||

          (
            navigator.platform ===
              'MacIntel'

            &&

            navigator.maxTouchPoints > 1
          );


        if (ios) {

          setTimeout(
            showIosInstall,
            600
          );

          return;

        }


        /*
          Android / Chrome / Samsung
        */

        setTimeout(
          function() {

            if (deferredPrompt) {

              showInstall();

            }

            else {

              showSamsungHelp();

            }

          },
          5000
        );

      }
    );


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if (
      'serviceWorker' in navigator
    ) {

      window.addEventListener(
        'load',
        function() {

          navigator
            .serviceWorker
            .register('./sw.js')

            .then(
              function(registration) {

                console.log(
                  'Infoscreen Service Worker aktiv:',
                  registration.scope
                );

              }
            )

            .catch(
              function(error) {

                console.error(
                  'Service Worker Fehler:',
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>
</html>
